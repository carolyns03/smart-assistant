<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal Brain — Context-Aware Enterprise Knowledge System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e8; }
    .header { background: #1a1a2e; color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1a73e8; }
    .header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .header .logo { font-size: 24px; }
    .header nav a { color: #a0a0c0; text-decoration: none; margin-left: 24px; font-size: 14px; }
    .header nav a:hover, .header nav a.active { color: white; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    .scenario-bar { background: #1a1a2e; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a4a; }
    .scenario-bar .title { font-size: 14px; font-weight: 700; color: #8ab4f8; margin-bottom: 10px; }
    .scenario-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .scenario-btns button { padding: 8px 14px; border: 1px solid #2a2a4a; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; background: #1a1a2e; color: #c0c0d0; transition: all 0.15s; }
    .scenario-btns button:hover { border-color: #1a73e8; color: #8ab4f8; background: #1e1e3a; }
    .scenario-btns button.active { border-color: #1a73e8; background: #1a73e8; color: white; }
    .user-bar { background: #1a1a2e; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a4a; }
    .user-bar label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 10px; color: #8ab4f8; }
    .user-select-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .user-card { border: 2px solid #2a2a4a; border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: all 0.15s; flex: 1; min-width: 150px; }
    .user-card:hover { border-color: #1a73e8; }
    .user-card.selected { border-color: #1a73e8; background: #162040; }
    .user-card .name { font-weight: 600; font-size: 13px; }
    .user-card .title-text { font-size: 11px; color: #888; margin-top: 2px; }
    .user-card .role-badge { display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-top: 4px; background: #2a2a4a; color: #c0c0d0; }
    .user-card .role-badge.perm-changed { background: #dc3545; color: white; }
    .chat-box { background: #1a1a2e; border-radius: 10px; border: 1px solid #2a2a4a; overflow: hidden; }
    .chat-messages { padding: 16px; max-height: 450px; overflow-y: auto; }
    .msg { margin-bottom: 12px; }
    .msg.user { text-align: right; }
    .msg .bubble { display: inline-block; padding: 10px 14px; border-radius: 12px; max-width: 80%; text-align: left; font-size: 13px; line-height: 1.6; }
    .msg.user .bubble { background: #1a73e8; color: white; }
    .msg.assistant .bubble { background: #2a2a3e; color: #e0e0e8; border: 1px solid #3a3a5a; }
    .msg.assistant .bubble pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; }
    .msg.system .bubble { background: #2a1a1a; color: #ff9999; border: 1px solid #5a2a2a; font-size: 12px; }
    .sources { margin-top: 8px; font-size: 11px; color: #888; }
    .sources .source-tag { display: inline-block; background: #162040; color: #8ab4f8; padding: 3px 8px; border-radius: 4px; margin: 2px; font-size: 10px; border: 1px solid #2a3a5a; }
    .stats-bar { font-size: 10px; color: #666; margin-top: 6px; }
    .platforms-bar { font-size: 10px; color: #8ab4f8; margin-top: 4px; }
    .freshness-bar { font-size: 10px; color: #28a745; margin-top: 4px; }
    .chat-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #2a2a4a; }
    .chat-input input { flex: 1; padding: 10px 12px; border: 1px solid #3a3a5a; border-radius: 6px; font-size: 13px; background: #0f1117; color: #e0e0e8; }
    .chat-input input::placeholder { color: #555; }
    .chat-input button { padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .chat-input button:hover { background: #1557b0; }
    .chat-input button:disabled { background: #333; cursor: not-allowed; }
    .demo-panel { background: #1a1a2e; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a4a; }
    .demo-panel .panel-title { font-size: 13px; font-weight: 700; color: #ffc107; margin-bottom: 10px; }
    .demo-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .demo-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .demo-btn-yellow { background: #ffc107; color: #333; }
    .demo-btn-yellow:hover { background: #e0a800; }
    .demo-btn-red { background: #dc3545; color: white; }
    .demo-btn-red:hover { background: #b02a37; }
    .demo-btn-blue { background: #1a73e8; color: white; }
    .demo-btn-blue:hover { background: #1557b0; }
    .demo-btn-green { background: #28a745; color: white; }
    .demo-btn-green:hover { background: #218838; }
    .refresh-bar { font-size: 10px; color: #28a745; margin-top: 8px; }
    .refresh-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #28a745; margin-right: 4px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .empty-state { text-align: center; color: #555; padding: 40px; font-size: 13px; }
    .scenario-desc { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }
    .sources .source-tag a { color: #8ab4f8; text-decoration: none; }
    .sources .source-tag a:hover { text-decoration: underline; }
    .provenance-bar { font-size: 10px; margin-top: 4px; }
    .provenance-live { color: #28a745; }
    .provenance-mock { color: #ffc107; }
    .provenance-error { color: #dc3545; }
    .provenance-empty { color: #888; }
    .connector-status { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; }
    .connector-badge { padding: 3px 8px; border-radius: 4px; border: 1px solid #2a2a4a; }
    .connector-badge.live { background: #1a3a1a; color: #6bcf6b; border-color: #2a5a2a; }
    .connector-badge.mock { background: #3a3a1a; color: #ffc107; border-color: #5a5a2a; }
    .connector-badge.error { background: #3a1a1a; color: #ff6b6b; border-color: #5a2a2a; }
    .connector-badge.empty { background: #2a2a3a; color: #888; }
    .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #333; border-top-color: #8ab4f8; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .resource-select { padding: 6px 10px; border: 1px solid #3a3a5a; border-radius: 6px; font-size: 12px; background: #0f1117; color: #e0e0e8; margin: 4px; max-width: 400px; }
    .llm-mode-bar { font-size: 10px; color: #a0a0c0; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="logo">🧠</span> Internal Brain</h1>
    <nav>
      <a href="/" class="active">Chat</a>
      <a href="/diary.html">Audit Trail</a>
    </nav>
  </div>

  <div class="container">
    <div class="scenario-bar">
      <div class="title">5 Scenario Demo Flows</div>
      <div class="scenario-btns">
        <button onclick="runScenario(1)">S1: Unified Query</button>
        <button onclick="runScenario(2)">S2: Data Freshness</button>
        <button onclick="runScenario(3)">S3: Permission Enforcement</button>
        <button onclick="runScenario(4)">S4: Permission Change</button>
        <button onclick="runScenario(5)">S5: Audit Inquiry</button>
      </div>
      <div class="scenario-desc" id="scenarioDesc">Each scenario demonstrates a key challenge requirement. Select one to see the guided demo flow.</div>
    </div>

    <div class="demo-panel" id="demoPanel" style="display:none;">
      <div class="panel-title" id="demoPanelTitle">Demo Controls</div>
      <div id="demoPanelContent"></div>
    </div>

    <div class="user-bar">
      <label>Select a persona (who is asking?)</label>
      <div class="user-select-row" id="userCards"></div>
      <div class="refresh-bar"><span class="refresh-dot"></span> <span id="dataModeText">Loading data mode...</span></div>
      <div class="connector-status" id="connectorStatus"></div>
    </div>

    <div class="chat-box">
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state">Select a persona and ask a question to get started.<br>Or click a scenario button above for a guided demo.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="queryInput" placeholder="Ask a question in natural language..." onkeypress="if(event.key==='Enter') askQuestion()">
        <button id="askBtn" onclick="askQuestion()">Ask</button>
      </div>
    </div>
  </div>

  <script>
    var selectedUser = null;
    var users = [];
    var permChangedUsers = new Set();
    var allResources = [];

    var scenarios = {
      1: {
        title: 'Scenario 1: Unified Natural-Language Query',
        desc: 'A backend engineer asks a question spanning multiple platforms. The system pulls from Jira and Slack, synthesizes one answer with citations, omitting Slack threads from private channels the engineer is not in.',
        user: 'user-junior',
        query: "What's the status of the database migration project and were there any blockers raised in Slack last week?",
        setup: function() {
          selectUser('user-junior');
          document.getElementById('queryInput').value = scenarios[1].query;
          addSystemMessage('Scenario 1 loaded: Backend Engineer asks about DB migration + Slack blockers. Click "Ask" to see the cross-platform unified answer.');
        }
      },
      2: {
        title: 'Scenario 2: Data Freshness',
        desc: 'An on-call engineer asks for the payment-service runbook. The runbook owner pushed a critical update (new failover step). The system must surface the updated version, not a stale cache.',
        user: 'user-oncall',
        query: "What's the latest runbook for the payment-service incident?",
        setup: function() {
          fetch('/api/apps/wiki/wiki-016', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'x-admin-user-id': 'user-compliance' },
            body: JSON.stringify({
              content: 'Payment-service incident response runbook. Step 1: Check Stripe dashboard for error rate. Step 2: Verify webhook endpoint is reachable. Step 3: If payment gateway is down, enable circuit breaker and queue payments. Step 4: NEW FAILVER STEP - Failover to backup payment gateway at pg-failover.company.internal if primary is down for more than 5 minutes. Step 5: Post incident status in #engineering. Step 6: Create P0 ticket in Jira. This runbook was updated at 1:00 PM today with the new failover step.',
              lastUpdated: new Date().toISOString(),
            }),
          }).then(function() {
            selectUser('user-oncall');
            document.getElementById('queryInput').value = scenarios[2].query;
            addSystemMessage('Scenario 2 loaded: Runbook updated at 1:00 PM with NEW failover step. On-call engineer asks for it. Click "Ask" to verify the answer includes the latest update (not stale).');
          });
        }
      },
      3: {
        title: 'Scenario 3: Correct Permission Enforcement (Negative Case)',
        desc: 'A contractor asks about the security breach incident report. The report is restricted. The system must NOT reveal the content or confirm the report exists beyond what the user already knows.',
        user: 'user-contractor',
        query: 'Show me the security incident report from the Q3 breach',
        setup: function() {
          selectUser('user-contractor');
          document.getElementById('queryInput').value = scenarios[3].query;
          addSystemMessage('Scenario 3 loaded: Contractor asks for the breach report (restricted). Click "Ask" - the answer should NOT contain the report contents or confirm its existence.');
        }
      },
      4: {
        title: 'Scenario 4: Generic Resource-Level Permission Change',
        desc: 'Select a user, select a resource, ask a question. Then DENY exactly one resource and ask again. The denied resource is excluded. Other resources remain. RESET restores the original permission.',
        user: 'user-junior',
        query: "What's the status of the database migration project?",
        setup: function() {
          selectUser('user-junior');
          document.getElementById('queryInput').value = scenarios[4].query;
          showGenericPermissionPanel();
          addSystemMessage('Scenario 4 loaded: Select a resource to DENY, then ask the same question again. The denied resource will be excluded from the answer.');
        }
      },
      5: {
        title: 'Scenario 5: Audit Inquiry',
        desc: 'A Compliance Officer queries the audit trail to reconstruct what a user asked, what was retrieved, what was answered, timestamps, and authorization decisions. Includes which platform the data came from.',
        user: 'user-compliance',
        query: '',
        setup: function() {
          selectUser('user-compliance');
          document.getElementById('queryInput').value = '';
          addSystemMessage('Scenario 5 loaded: Compliance Officer mode. Go to the Audit Trail page to search what any user has asked, what was retrieved, and what was answered. You can search by user to reconstruct their activity.');
          window.open('/diary.html', '_blank');
        }
      }
    };

    function loadUsers() {
      fetch('/api/users').then(function(r) { return r.json(); }).then(function(data) {
        users = data;
        renderUserCards();
        loadConnectorStatus();
      });
    }

    function loadConnectorStatus() {
      fetch('/api/refresh').then(function(r) { return r.json(); }).then(function(data) {
        var dataMode = data.dataSource === 'live' ? 'LIVE API mode' : 'JSON (mock) mode';
        document.getElementById('dataModeText').textContent = dataMode + ' — ' + data.message;

        var statusHtml = '';
        var cs = data.connectorStatus;
        if (cs) {
          var appNames = { wiki: 'Confluence', jira: 'Jira', slack: 'Slack', drive: 'Drive' };
          for (var key of Object.keys(cs)) {
            var s = cs[key].status;
            var cls = s === 'LIVE' ? 'live' : (s === 'MOCK' ? 'mock' : (s === 'ERROR' ? 'error' : 'empty'));
            statusHtml += '<span class="connector-badge ' + cls + '">' + appNames[key] + ': ' + s + ' (' + cs[key].count + ')</span>';
          }
        }
        document.getElementById('connectorStatus').innerHTML = statusHtml;
      });
    }

    function renderUserCards() {
      var container = document.getElementById('userCards');
      container.innerHTML = '';
      users.forEach(function(u) {
        var card = document.createElement('div');
        card.className = 'user-card';
        card.onclick = function() { selectUser(u.id); };
        var permClass = permChangedUsers.has(u.id) ? ' perm-changed' : '';
        card.innerHTML = '<div class="name">' + u.name + '</div>' +
          '<div class="title-text">' + u.title + '</div>' +
          '<div class="role-badge' + permClass + '">' + u.role + (permChangedUsers.has(u.id) ? ' (changed)' : '') + '</div>';
        container.appendChild(card);
      });
    }

    function selectUser(userId) {
      selectedUser = userId;
      var cards = document.querySelectorAll('.user-card');
      cards.forEach(function(c, i) {
        c.classList.toggle('selected', users[i].id === userId);
      });
    }

    function askQuestion() {
      if (!selectedUser) { alert('Please select a persona first.'); return; }
      var input = document.getElementById('queryInput');
      var query = input.value.trim();
      if (!query) return;
      addMessage('user', query);
      input.value = '';
      document.getElementById('askBtn').disabled = true;
      document.getElementById('askBtn').innerHTML = '<span class="loading-spinner"></span> Asking...';
      fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: selectedUser, query: query }),
      }).then(function(r) { return r.json(); }).then(function(data) {
        addMessage('assistant', data);
        document.getElementById('askBtn').disabled = false;
        document.getElementById('askBtn').textContent = 'Ask';
      }).catch(function(err) {
        addSystemMessage('Error: ' + err.message);
        document.getElementById('askBtn').disabled = false;
        document.getElementById('askBtn').textContent = 'Ask';
      });
    }

    function addMessage(role, data) {
      var container = document.getElementById('chatMessages');
      var empty = container.querySelector('.empty-state');
      if (empty) empty.remove();
      var msg = document.createElement('div');
      msg.className = 'msg ' + role;
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (role === 'user') {
        bubble.textContent = data;
      } else {
        var html = '<pre>' + escapeHtml(data.answer) + '</pre>';
        if (data.platforms && data.platforms.length > 0) {
          html += '<div class="platforms-bar">Platforms consulted: ' + data.platforms.join(', ') + '</div>';
        }
        // Provenance (LIVE/MOCK labels)
        if (data.provenance) {
          var appNames = { wiki: 'Confluence', jira: 'Jira', slack: 'Slack', drive: 'Drive' };
          var provParts = [];
          for (var key of Object.keys(data.provenance)) {
            var p = data.provenance[key];
            var pcls = p.status === 'LIVE' ? 'provenance-live' : (p.status === 'MOCK' ? 'provenance-mock' : (p.status === 'ERROR' ? 'provenance-error' : 'provenance-empty'));
            provParts.push('<span class="' + pcls + '">' + (appNames[key] || key) + ': ' + p.status + '</span>');
          }
          if (provParts.length > 0) {
            html += '<div class="provenance-bar">Data source: ' + provParts.join(' | ') + '</div>';
          }
        }
        if (data.freshness) {
          html += '<div class="freshness-bar">Latest data updated: ' + new Date(data.freshness).toLocaleString() + '</div>';
        }
        if (data.sources && data.sources.length > 0) {
          html += '<div class="sources"><strong>Sources:</strong> ';
          data.sources.forEach(function(s) {
            var appName = ({wiki:'Confluence',jira:'Jira',slack:'Slack',drive:'Drive'})[s.app] || s.app;
            var sourceId = s.app.toUpperCase() + '-' + s.id.replace(new RegExp('^' + s.app + '-', 'i'), '');
            if (s.sourceUrl) {
              html += '<span class="source-tag"><a href="' + escapeHtml(s.sourceUrl) + '" target="_blank">[' + sourceId + '] ' + escapeHtml(s.title) + ' \u2197</a></span>';
            } else {
              html += '<span class="source-tag">[' + sourceId + '] ' + escapeHtml(s.title) + '</span>';
            }
          });
          html += '</div>';
        }
        if (data.llmMode) {
          html += '<div class="llm-mode-bar">LLM: ' + escapeHtml(data.llmMode) + '</div>';
        }
        if (data.deniedItems && data.deniedItems.length > 0) {
          html += '<div class="sources" style="color:#dc3545;">Denied: ' + data.deniedItems.length + ' resource(s) filtered before LLM</div>';
        }
        if (data.stats) {
          html += '<div class="stats-bar">' + data.stats.visible + '/' + data.stats.total + ' resources authorized (' + data.stats.hidden + ' denied)</div>';
        }
        if (data.diaryEntryIndex !== undefined && data.diaryEntryIndex !== null) {
          html += '<div class="stats-bar">Audit entry #' + data.diaryEntryIndex + '</div>';
        }
        bubble.innerHTML = html;
      }
      msg.appendChild(bubble);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function addSystemMessage(text) {
      var container = document.getElementById('chatMessages');
      var empty = container.querySelector('.empty-state');
      if (empty) empty.remove();
      var msg = document.createElement('div');
      msg.className = 'msg system';
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function runScenario(num) {
      var s = scenarios[num];
      if (!s) return;
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('demoPanel').style.display = 'none';
      document.querySelectorAll('.scenario-btns button').forEach(function(b, i) {
        b.classList.toggle('active', i === num - 1);
      });
      document.getElementById('scenarioDesc').innerHTML = '<strong>' + s.title + '</strong><br>' + s.desc;
      s.setup();
    }

    function showGenericPermissionPanel() {
      var panel = document.getElementById('demoPanel');
      panel.style.display = 'block';
      document.getElementById('demoPanelTitle').textContent = 'S4: Generic Resource-Level Permission Controls';
      document.getElementById('demoPanelContent').innerHTML = '' +
        '<div style="margin-bottom:10px;font-size:12px;color:#aaa;">' +
          '1. Select a user (above) and ask a question.<br>' +
          '2. Select a resource to DENY.<br>' +
          '3. Ask the SAME question — the denied resource is excluded.<br>' +
          '4. RESET to restore the original permission.' +
        '</div>' +
        '<div class="demo-row" style="margin-bottom:8px;">' +
          '<label style="font-size:12px;color:#8ab4f8;">Resource:</label>' +
          '<select id="resourceSelect" class="resource-select"><option value="">Loading resources...</option></select>' +
        '</div>' +
        '<div class="demo-row">' +
          '<button class="demo-btn-red" onclick="denySelected()">DENY selected resource</button>' +
          '<button class="demo-btn-green" onclick="resetSelected()">RESET selected resource</button>' +
        '</div>' +
        '<div style="margin-top:8px;font-size:11px;color:#666;">Additional role-based tests:</div>' +
        '<div class="demo-row" style="margin-top:4px;">' +
          '<button class="demo-btn-blue" onclick="changeRole(selectedUser,\'security_team\')">Add permissions (security_team)</button>' +
          '<button class="demo-btn-red" onclick="changeRole(selectedUser,\'contractor\')">Remove permissions (contractor)</button>' +
        '</div>' +
        '<div class="demo-row" style="margin-top:8px;">' +
          '<button class="demo-btn-green" onclick="resetPermissions(selectedUser)">Reset user permissions</button>' +
          '<button class="demo-btn-green" onclick="resetAll()">Reset ALL demo changes</button>' +
        '</div>';
      loadResourcesForDropdown();
    }

    function loadResourcesForDropdown() {
      var adminHeader = selectedUser ? { 'x-admin-user-id': selectedUser } : {};
      var appNames = { wiki: 'Confluence', jira: 'Jira', slack: 'Slack', drive: 'Drive' };
      var promises = Object.keys(appNames).map(function(appKey) {
        return fetch('/api/apps/' + appKey, { headers: adminHeader })
          .then(function(r) {
            if (!r.ok) return [];
            return r.json();
          })
          .then(function(items) {
            return items.map(function(item) {
              return { app: appKey, id: item.id, title: item.title || (item.channel + ' — ' + item.author), appLabel: appNames[appKey] };
            });
          })
          .catch(function() { return []; });
      });

      Promise.all(promises).then(function(results) {
        allResources = [];
        results.forEach(function(arr) { allResources = allResources.concat(arr); });
        var sel = document.getElementById('resourceSelect');
        if (sel) {
          sel.innerHTML = '';
          allResources.forEach(function(r) {
            sel.innerHTML += '<option value="' + r.app + '/' + r.id + '">' + r.appLabel + ': ' + escapeHtml(r.title) + ' (' + r.id + ')</option>';
          });
          if (allResources.length === 0) {
            sel.innerHTML = '<option value="">No resources available</option>';
          }
        }
      });
    }

    function denySelected() {
      var sel = document.getElementById('resourceSelect');
      if (!sel || !sel.value) { alert('Select a resource first.'); return; }
      var parts = sel.value.split('/');
      var appKey = parts[0];
      var itemId = parts.slice(1).join('/');
      toggleResource(selectedUser, appKey, itemId, 'deny');
    }

    function resetSelected() {
      var sel = document.getElementById('resourceSelect');
      if (!sel || !sel.value) { alert('Select a resource first.'); return; }
      var parts = sel.value.split('/');
      var appKey = parts[0];
      var itemId = parts.slice(1).join('/');
      toggleResource(selectedUser, appKey, itemId, 'reset');
    }

    function toggleResource(userId, appKey, itemId, action) {
      if (!userId) { alert('Select a user first.'); return; }
      fetch('/api/permissions/' + userId + '/resource/' + appKey + '/' + itemId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-admin-user-id': 'user-compliance' },
        body: JSON.stringify({ action: action }),
      }).then(function(r) { return r.json(); }).then(function(data) {
        permChangedUsers.add(userId);
        renderUserCards();
        selectUser(userId);
        addSystemMessage('Resource permission: ' + data.message + ' Ask the same question again to see the answer change.');
      });
    }

    function changeRole(userId, newRole) {
      if (!userId) { alert('Select a user first.'); return; }
      fetch('/api/users/' + userId + '/role', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-admin-user-id': 'user-compliance' },
        body: JSON.stringify({ role: newRole }),
      }).then(function(r) { return r.json(); }).then(function(data) {
        permChangedUsers.add(userId);
        renderUserCards();
        selectUser(userId);
        addSystemMessage('Role changed: ' + data.message + ' Now ask the same question again to see the answer change.');
      });
    }

    function resetPermissions(userId) {
      if (!userId) { alert('Select a user first.'); return; }
      fetch('/api/permissions/' + userId + '/reset', {
        method: 'POST',
        headers: { 'x-admin-user-id': 'user-compliance' },
      }).then(function(r) { return r.json(); }).then(function(data) {
        permChangedUsers.delete(userId);
        renderUserCards();
        selectUser(userId);
        addSystemMessage('Permissions reset for ' + userId + '.');
      });
    }

    function resetAll() {
      fetch('/api/reset', {
        method: 'POST',
        headers: { 'x-admin-user-id': 'user-compliance' },
      }).then(function(r) { return r.json(); }).then(function(data) {
        permChangedUsers.clear();
        renderUserCards();
        document.getElementById('chatMessages').innerHTML = '';
        addSystemMessage('All demo changes reset. Diary cleared, permissions restored to defaults.');
      });
    }

    loadUsers();
  </script>
</body>
</html>
